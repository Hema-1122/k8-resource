apiVersion: v1
kind: PersistentVolume
metadata:
  name: statefulset-pvc
spec:
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 10Gi
  csi:
     driver: local.csi.k8s.io
     volumeHandle: statefulset-volume
     fsType: ext4

---
apiVersion: v1  
kind: PersistentVolumeClaim
metadata:
  name: statefulset-pvc
spec:
  storageClassName: ""
  volumeName: statefulset-pvc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi