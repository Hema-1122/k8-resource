apiVersion: v1
kind : Pod
metadata:
   name : emptydir
   namespace: default
   labels:
      name : emptydir
spec :
   containers :
    - name : nginx
      image : nginx:latest
      command: [ "sleep", "1000000" ]
      volumeMounts:
       - name: emptydir-volume
         mountPath: /var/log/nginx
      volumes:
      - name: emptydir-volume
        emptyDir: 
          sizeLimit: "10Mi"