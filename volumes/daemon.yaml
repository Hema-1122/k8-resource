apiVersion: v1
kind: PersistentVolume
metadata:
  name: daemon-pv
spec:
  
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 10Gi
  csi:
     driver: local.csi.k8s.io
     volumeHandle: daemon-volume
     fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daemon-pvc
spec:
  storageClassName: ""
  volumeName: daemon-pv
  accessModes:
    - ReadWriteOnce
    
  resources:
    requests:
      storage: 10Gi
