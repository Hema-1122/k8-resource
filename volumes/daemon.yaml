apiVersion: v1
kind: PersistentVolume
metadata:
  name: daemon-pv
spec:
  
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 10Gi
  csi:
     driver: local.csi.k8s.io
     volumeHandle: daemon-volume
     fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daemon-pvc
spec:
  storageClassName: ""
  volumeName: daemon-pv
  accessModes:
    - ReadWriteOnce
    
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: daemon-pod
spec:
  containers:
    - name: daemon-container
      image: busybox
      command: [ "sleep", "3600" ]
      volumeMounts:
        - mountPath: "/mnt/daemon"
          name: daemon- volume
  volumes:
    - name: daemon-volume
      persistentVolumeClaim:
        claimName: daemon-pvc