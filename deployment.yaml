apiVersion: apps/v1
kind : Deployment
metadata :
  name : nginx
  Labels :
    project: roboshop
    environment: dev
spec :
  replicas : 2
  selector :
    matchLabels :
      project: roboshop
      environment: dev
  template :
    metadata :
      labels :
        project: roboshop
        environment: dev
    spec :
      containers :
        - name : nginx
          image : nginx:latest
          ports :
            - containerPort : 80