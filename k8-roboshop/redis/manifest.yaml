apiVersion: apps/v1
kind : Deployment
metadata:
  name : redis
  namespace: roboshop
  labels:
    project: roboshop
    component: database
    tier : db
spec:
  replicas : 1
  selector :
   matchLabels :
      project: roboshop
      component: database
      tier : db
  template :
    metadata: 
      labels:
        project: roboshop
        component: database
        tier : db
    spec :
      containers :
        - name : redis
          image : redis:7.0
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
             path: /health
             port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
             path: /health
             port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind : Service
metadata:
  name : redis
  namespace: roboshop
spec :
  selector :
      project: roboshop
      component: database
      tier : db
  ports :
    - protocol : TCP
      port : 6379
      targetPort : 6379       
            