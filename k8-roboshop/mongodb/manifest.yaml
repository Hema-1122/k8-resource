apiVersion: apps/v1
kind : Deployment
metadata:
  name : mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: database
    tier : db
spec :
  replicas : 1
  selector :
   matchLabels :
      project: roboshop
      component: database
      tier : db
  template :
    metadata:
      labels:
        project: roboshop
        component: database
        tier : db
    spec :
      containers :
       - name : mongodb
         image : joindevops/mongodb:v1
         livenessProbe:
          httpGet:
          path: /health
          port: 27017
          initialDelaySeconds: 5
          periodSeconds: 10
         readinessProbe:
          httpGet:
          path: /health
          port: 27017
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind : Service
metadata:
  name : mongodb
  namespace: roboshop
spec :
  selector :
      project: roboshop
      component: mongodb
      tier : db
  ports :
    - protocol : TCP
      port : 27017
      targetPort : 27017