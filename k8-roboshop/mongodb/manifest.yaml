apiVersion: apps/v1
kind : Deployment
metadata:
  name : mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: database
    tier : db
spec :
  replicas : 1
  selector:
    matchLabels:
      project: roboshop
      component: database
      tier : db
  template:
    metadata:
      labels:
        project: roboshop
        component: database
        tier : db 
    spec :
      containers :
       - name : mongodb
         image : joindevops/mongodb:v1
         ports:
          - containerPort: 27017
         
       